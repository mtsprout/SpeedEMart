name: Flatpak

on:
  push:
    branches: [main]
    paths: ['src/**', 'packaging/flatpak/**', '.github/workflows/flatpak.yml']
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'packaging/flatpak/**', '.github/workflows/flatpak.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SpeedEMart.flatpak
          manifest-path: packaging/flatpak/io.github.mtsprout.SpeedEMart.yml
          cache-key: flatpak-builder-${{ github.sha }}

  # Pushing a tag like v1.0 attaches the built bundle to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: '**/*.flatpak'
          generate_release_notes: true
